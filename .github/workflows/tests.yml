name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check ms_ipv6 tests
      - name: Check formatting
        run: python -m ruff format --check ms_ipv6 tests
      # Public IPv6 connectivity depends on the runner's network, not its OS.
      - name: Test without external IPv6 connectivity
        run: python -m pytest -q -k "not test_ipv6_connection"
